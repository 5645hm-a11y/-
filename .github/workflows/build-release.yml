name: Build and Release Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci
        env:
          # Skip downloading the Linux Electron binary — we only build for Windows
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install wine + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wine wine64 xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          wine --version

      # electron-builder uses rcedit-ia32.exe (32-bit) to stamp version info.
      # wine32 is hard to install on ubuntu-latest, so we swap in the x64 variant
      # which wine64 can run directly.
      - name: Pre-download winCodeSign and patch rcedit ia32→x64
        run: |
          WCSVER="2.6.0"
          CACHE="$HOME/.cache/electron-builder/winCodeSign/winCodeSign-${WCSVER}"
          mkdir -p "$CACHE"
          wget -q "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-${WCSVER}/winCodeSign-${WCSVER}.7z" -O /tmp/wcs.7z
          cd "$CACHE" && 7z x /tmp/wcs.7z -y > /dev/null
          # Move contents up if extracted into a subdirectory
          [ -f "winCodeSign-${WCSVER}/rcedit-x64.exe" ] && cp -r "winCodeSign-${WCSVER}/." . && rm -rf "winCodeSign-${WCSVER}"
          cp rcedit-x64.exe rcedit-ia32.exe
          echo "rcedit-ia32 → x64 patched"
          ls -la *.exe

      # electron-builder on Linux runs the NSIS installer stub via wine to
      # extract the uninstaller binary. The pure-JS UninstallerReader already
      # exists in electron-builder (used on macOS Catalina) — we extend it to
      # Linux to avoid wine running a 32-bit NSIS stub.
      - name: Patch electron-builder NsisTarget (UninstallerReader on Linux)
        run: |
          node -e "
            const fs = require('fs');
            const f = 'node_modules/app-builder-lib/out/targets/nsis/NsisTarget.js';
            let src = fs.readFileSync(f, 'utf8');
            const before = 'on_1.isMacOsCatalina)()) {';
            const after  = 'on_1.isMacOsCatalina)() || process.platform === \"linux\") {';
            if (!src.includes(before)) {
              console.log('Pattern not found — checking installed version...');
              const pkg = require('./node_modules/app-builder-lib/package.json');
              console.log('app-builder-lib version:', pkg.version);
              // Try alternate pattern for newer versions
              const alt = 'macosVersion_1.isMacOsCatalina()) {';
              if (src.includes(alt)) {
                const patched = src.replace(alt, 'macosVersion_1.isMacOsCatalina() || process.platform === \"linux\") {');
                fs.writeFileSync(f, patched);
                console.log('Patched with alternate pattern OK');
              } else {
                console.log('WARNING: Could not find pattern — build may fail at uninstaller step');
                process.exit(0); // non-fatal, wine+Xvfb will handle it
              }
            } else {
              fs.writeFileSync(f, src.replace(before, after));
              console.log('NsisTarget.js patched OK');
            }
          "

      - name: Build Windows installer
        run: npm run build
        env:
          WINEDEBUG: -all

      - name: List dist output
        run: ls -lh dist/

      - name: Rename installer to ASCII filename
        id: rename
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          SRC=$(find dist -maxdepth 1 -name "*.exe" ! -name "__uninstaller*" | head -1)
          echo "Found: $SRC"
          cp "$SRC" "dist/Setup.${VERSION}.exe"
          echo "installer=dist/Setup.${VERSION}.exe" >> "$GITHUB_OUTPUT"
          ls -lh "dist/Setup.${VERSION}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }} - Fix crash after cancelled update"
          body: |
            ## Version ${{ env.VERSION }}

            ### Fixed
            - App crash (`Object has been destroyed`) after cancelling an update
            - Installer "cannot be closed" error when app is in system tray
            - Update cancel button now properly aborts the scheduled quit
            - Added `isDestroyed()` guards throughout main window access
          files: ${{ steps.rename.outputs.installer }}
          make_latest: true
