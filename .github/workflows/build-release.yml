name: Build and Release Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install wine + 7zip
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y wine wine64 wine32 p7zip-full
          wine --version

      - name: Build Windows installer
        run: npm run build
        env:
          DISPLAY: ""
          WINEDEBUG: -all
          DEBUG: electron-builder

      - name: List dist output
        run: ls -lh dist/

      - name: Rename installer to ASCII filename
        id: rename
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          SRC=$(find dist -maxdepth 1 -name "*.exe" ! -name "__uninstaller*" | head -1)
          echo "Found EXE: $SRC"
          DEST="dist/Setup.${VERSION}.exe"
          cp "$SRC" "$DEST"
          echo "installer=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }} - Fix crash after cancelled update"
          body: |
            ## Version ${{ env.VERSION }}

            ### Fixed
            - App crash (Object has been destroyed) after cancelling an update
            - Installer "cannot be closed" error on tray apps
            - Update cancel button now works correctly
          files: ${{ steps.rename.outputs.installer }}
          make_latest: true
