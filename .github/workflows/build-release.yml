name: Build and Release Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        id: build
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed (exit $LASTEXITCODE)"
          }

      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Rename installer to ASCII filename
        id: rename
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Write-Output "VERSION=$version" >> $env:GITHUB_ENV
          $src = Get-ChildItem dist\*.exe | Where-Object { $_.Name -notlike "__uninstaller*" } | Select-Object -First 1
          if (-not $src) { throw "No installer .exe found in dist\" }
          Write-Output "Found: $($src.FullName)"
          Copy-Item $src.FullName "dist\Setup.$version.exe"
          Write-Output "installer=dist/Setup.$version.exe" >> $env:GITHUB_OUTPUT
          Write-Output "Installer size: $([math]::Round($src.Length/1MB, 1)) MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }} - Fix crash after cancelled update"
          body: |
            ## Version ${{ env.VERSION }}

            ### Fixed
            - App crash (`Object has been destroyed`) after cancelling an update
            - Installer "cannot be closed" error when app is in system tray
            - Update cancel button now properly aborts the scheduled quit
            - Added `isDestroyed()` guards throughout main window access
          files: ${{ steps.rename.outputs.installer }}
          make_latest: true

      - name: Create issue with build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'build-log.txt not found';
            if (fs.existsSync('build-log.txt')) {
              log = fs.readFileSync('build-log.txt', 'utf8');
              if (log.length > 60000) log = log.slice(-60000);
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed — run #${context.runNumber}`,
              body: `Build failed on \`windows-latest\` (run #${context.runNumber}).\n\n\`\`\`\n${log}\n\`\`\``,
            });
