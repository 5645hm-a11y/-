name: Build and Release Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build

      - name: Rename installer to ASCII filename
        id: rename
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Write-Output "VERSION=$version" >> $env:GITHUB_ENV
          $src = Get-ChildItem dist\*.exe | Where-Object { $_.Name -notlike "__uninstaller*" } | Select-Object -First 1
          Write-Output "Found: $($src.FullName)"
          Copy-Item $src.FullName "dist\Setup.$version.exe"
          Write-Output "installer=dist/Setup.$version.exe" >> $env:GITHUB_OUTPUT
          Write-Output "Installer size: $([math]::Round($src.Length/1MB, 1)) MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }} - Fix crash after cancelled update"
          body: |
            ## Version ${{ env.VERSION }}

            ### Fixed
            - App crash (`Object has been destroyed`) after cancelling an update
            - Installer "cannot be closed" error when app is in system tray
            - Update cancel button now properly aborts the scheduled quit
            - Added `isDestroyed()` guards throughout main window access
          files: ${{ steps.rename.outputs.installer }}
          make_latest: true
